[project]
name = "sigops"
version = "0.1.0"
description = "Signal Operations - RSS ingestion pipeline"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "feedparser>=6.0",
    "typesafe-sdk>=0.7.5",
    "python-dotenv>=1.2.4",
    "trafilatura>=2.4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sigops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=sigops --cov-report=term-missing"
